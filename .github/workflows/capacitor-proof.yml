name: Capacitor proof

# Manual only — this is a one-off build/boot check for the Capacitor
# scaffolding (server.url wraps the live production site), not a gate
# on every push. Run from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            build

      - name: Boot simulator, install and launch the app
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone 15 (' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.pinacot.app
          sleep 15
          xcrun simctl io "$UDID" screenshot ios-screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-screenshot.png

  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Run emulator, install and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.pinacot.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshot
          path: android-screenshot.png
